<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRATEGY · Tienda online</title>
  <meta name="description" content="Tienda online de STRATEGY, juego de mesa educativo para aprender matemáticas de 4° a 8° básico. Proyecto académico INACAP.">
  <style>
    :root { --azul: #1f3a8a; --naranja: #f59e0b; --gris: #f3f4f6; --texto: #111827; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: var(--gris); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    main { background: #fff; border-radius: 1rem; padding: 2.5rem 2rem; max-width: 34rem; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.08); text-align: center; }
    .badge { display: inline-block; background: var(--naranja); color: #fff; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; padding: .35rem .8rem; border-radius: 999px; font-weight: 700; }
    h1 { margin: 1rem 0 .5rem; font-size: 2rem; color: var(--azul); }
    p { line-height: 1.6; color: #4b5563; }
    .nota { margin-top: 1.5rem; font-size: .85rem; color: #6b7280; border-top: 1px solid #e5e7eb; padding-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Sitio en construcción</span>
    <h1>STRATEGY</h1>
    <p>Juego de mesa educativo para aprender matemáticas de 4° a 8° básico.</p>
    <p>La tienda online se publicará en esta misma dirección cuando esté lista.</p>
    <p class="nota">Proyecto académico · Ventas y Servicios · INACAP</p>
  </main>
</body>
</html>
